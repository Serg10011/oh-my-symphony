<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Обзор проектов · Конвейер</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f7f9,#181a1e);--surface:light-dark(#fff,#22252a);--text:light-dark(#202733,#edf0f5);--muted:light-dark(#576475,#b3bdcb);--line:light-dark(#dce1e8,#41464f);--green:light-dark(#247846,#8ad7a5);--red:light-dark(#aa3444,#ffa4b1);--orange:light-dark(#8d6010,#efc474);font:16px/1.5 system-ui,sans-serif;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}main{max-width:1060px;margin:auto;padding:32px 24px 56px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}h1{font-size:30px;letter-spacing:-.04em;line-height:1.2;margin:4px 0 8px}h2{font-size:22px;line-height:1.3;margin:0}p{margin:0}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.subtitle,.updated,.message{color:var(--muted);font-size:14px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.button{font:inherit;font-size:14px;display:inline-block;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);text-decoration:none;cursor:pointer}.button:disabled{opacity:.6;cursor:wait}#error{color:var(--red);margin-bottom:16px}#projects{display:grid;gap:22px}.project{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}.project-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.project-title{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.status{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}.status:before{content:"";height:7px;width:7px;flex-shrink:0;border-radius:50%;background:currentColor}.status.running{color:var(--green)}.status.error,.status.mismatch{color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.metric{background:var(--bg);border-radius:8px;padding:12px 14px}.metric strong{display:block;font-size:26px;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums}.metric span{font-size:13px;color:var(--muted)}.project-message{font-size:14px;color:var(--muted);margin-top:12px}.warning{font-size:14px;color:var(--orange);margin:12px 0}.task{border-top:1px solid var(--line);padding:12px 0}.task>summary{cursor:pointer;overflow-wrap:anywhere;display:flex;gap:10px;align-items:baseline;list-style:none}.task>summary::-webkit-details-marker{display:none}.task>summary:before{content:"▸";color:var(--muted)}.task[open]>summary:before{content:"▾"}.task>summary>.row{flex:1}.row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;min-width:0}.card-row{padding:9px 0;border-top:1px solid var(--line);margin-top:8px}.identifier{font:12px ui-monospace,monospace;color:var(--muted);white-space:nowrap}.title{flex:1;min-width:120px;overflow-wrap:anywhere;font-size:14px}.state{font-size:12px;color:var(--muted);background:var(--bg);border-radius:5px;padding:2px 7px;max-width:100%;overflow-wrap:anywhere}.state.help{color:var(--red)}.state.review{color:var(--orange)}.history{margin-top:14px}.history>summary{font-size:14px;color:var(--muted);cursor:pointer}.empty{color:var(--muted);font-size:14px;margin-top:14px}.runtime{font-size:13px;color:var(--muted);margin:8px 0}.note{font-size:12px;color:var(--muted);margin-top:28px}
@media(max-width:560px){main{padding:22px 14px 32px}.project{padding:16px}h1{font-size:26px}.metrics{gap:7px}.metric{padding:10px 8px}.metric span{font-size:12px}.title{min-width:100px}}
</style>
</head>
<body>
<main>
  <header><div><p class="eyebrow">Конвейер · Наблюдение</p><h1>Обзор проектов</h1><p class="subtitle">Задачи, подзадачи и то, что требует твоего внимания</p></div><div class="toolbar"><span class="updated" id="updated">Загрузка…</span><button class="button" id="refresh" type="button">Обновить</button></div></header>
  <p id="error" role="alert" hidden></p>
  <section id="projects" aria-label="Проекты"></section>
  <p class="note">Сводка считает карточки, включая подзадачи. Полностью завершённые группы показаны отдельно. Обновление — каждые 10 секунд.</p>
</main>
<script src="/overview.js" defer></script>
</body>
</html>
